name: Remote MCP prototype checks

on:
  push:
    branches:
      - remote-mcp-dev
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Engine regression tests
        run: npm test

      - name: Remote HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail

          MCP_TOKEN=ci-test-token PORT=3210 npm run start:http > /tmp/jianghu-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/jianghu-http.log || true' EXIT

          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3210/health > /tmp/health.json; then
              break
            fi
            sleep 0.5
          done

          grep -q '"ok":true' /tmp/health.json
          grep -q '"transport":"streamable-http"' /tmp/health.json

          STATUS=$(curl --silent --output /tmp/unauthorized.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            http://127.0.0.1:3210/mcp)

          test "$STATUS" = "401"
          grep -q '"Unauthorized"' /tmp/unauthorized.json

          curl --fail --silent \
            --request POST \
            --header 'Authorization: Bearer ci-test-token' \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":10,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"jianghu-ci","version":"1.0.0"}}}' \
            http://127.0.0.1:3210/mcp > /tmp/initialize.txt

          grep -q 'jianghu-rp-mcp' /tmp/initialize.txt

          curl --fail --silent \
            --request POST \
            --header 'Authorization: Bearer ci-test-token' \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --header 'MCP-Protocol-Version: 2025-11-25' \
            --data '{"jsonrpc":"2.0","id":11,"method":"tools/list","params":{}}' \
            http://127.0.0.1:3210/mcp > /tmp/tools.txt

          for TOOL in game_help new_game roll game_action game_info; do
            grep -q "\"name\":\"${TOOL}\"" /tmp/tools.txt
          done

          curl --fail --silent \
            --request POST \
            --header 'Authorization: Bearer ci-test-token' \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --header 'MCP-Protocol-Version: 2025-11-25' \
            --data '{"jsonrpc":"2.0","id":12,"method":"tools/call","params":{"name":"new_game","arguments":{"sessionId":"ci_remote_smoke","humanName":"CI","aiName":"AI","humanIdentityMode":"random","aiIdentityMode":"random"}}}' \
            http://127.0.0.1:3210/mcp > /tmp/new-game.txt

          grep -q 'ci_remote_smoke' /tmp/new-game.txt

          curl --fail --silent \
            --request POST \
            --header 'Authorization: Bearer ci-test-token' \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --header 'MCP-Protocol-Version: 2025-11-25' \
            --data '{"jsonrpc":"2.0","id":13,"method":"tools/call","params":{"name":"roll","arguments":{"sessionId":"ci_remote_smoke"}}}' \
            http://127.0.0.1:3210/mcp > /tmp/roll.txt

          grep -q '掷骰' /tmp/roll.txt
